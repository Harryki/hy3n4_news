services:
  app:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./.wrangler:/app/.wrangler
    environment:
      - NODE_ENV=development
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}

volumes:
  node_modules:
